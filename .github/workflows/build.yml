name: Build and Push

on:
  workflow_call:
    inputs:
      build-args:
        required: false
        type: string
        default: ""
      checkout-branch:
        required: true
        type: string
      dockerfile-path:
        required: false
        type: string
        default: Dockerfile
      dockerfile-context:
        required: false
        type: string
        default: .
      environment:
        required: true
        type: string

    outputs:
      image-tag: 
        value: ${{ jobs.build-and-push.outputs.image-tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image-tag: ${{ steps.extract-image-tag.outputs.image-tag }}
    env:
      REGISTRY: ghcr.io
      IMAGE: visualgraphxllc/pop-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.checkout-branch }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.0.0
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Setup .env file
        run: |
            secret_json=$(aws secretsmanager get-secret-value \
              --region "$AWS_REGION" \
              --secret-id "$SECRET_NAME" \
              --query "SecretString" \
              --output text)

            # Convert JSON to key=value and save to secrets.txt
            echo "$secret_json" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SECRET_NAME: ${{ vars.SECRET_NAME }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-
            type=raw,value=stage,enable=${{ github.ref_name == 'stage' }}
            type=raw,value=qa,enable=${{ github.ref_name == 'qa' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ inputs.dockerfile-context }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max
          build-args: ${{ inputs.build-args }}

      - name: Extract Image Tag
        id: extract-image-tag
        shell: bash
        run: |
            # Get the full image name with tag
            TAGS="${{ steps.meta.outputs.tags }}"
            FULL_IMAGE=$(echo "$TAGS" | grep -E ':[A-Za-z0-9._-]+-[0-9a-f]{6,}$' | head -n 1)

            # Extract just the tag portion
            TAG_ONLY=$(echo "$FULL_IMAGE" | cut -d':' -f2-)
            echo "Tag is $TAG_ONLY"
            echo "image-tag=$TAG_ONLY" >> $GITHUB_OUTPUT
